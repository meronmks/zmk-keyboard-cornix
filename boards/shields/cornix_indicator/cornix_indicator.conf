## use ws2812-spi
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_WS2812=y
CONFIG_RGBLED_WIDGET_LED_COUNT=2
CONFIG_RGBLED_WIDGET_SPATIAL_MAPPING=y

CONFIG_RGBLED_WIDGET_BRIGHTNESS=16
# Match the stock Cornix indicator scope: battery on LED 0 and connection on LED 1.
# Layer indicators remain disabled by default, and the fork's extra Caps Lock status is disabled.
CONFIG_RGBLED_WIDGET_BATTERY_LED_INDEX=0
CONFIG_RGBLED_WIDGET_CONN_LED_INDEX=1
CONFIG_RGBLED_WIDGET_SHOW_CAPSLOCK=n
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=n
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=n

# Keep the selected BT profile color pulsing/blinking until the connection event arrives.
# A duration of 0 means these disconnected animations have no timeout.
CONFIG_RGBLED_WIDGET_CONN_ADV_DURATION_MS=0
CONFIG_RGBLED_WIDGET_CONN_DISCONNECTED_DURATION_MS=0

# Turn off the WS2812 power rail 1 second after the indicators become idle.
CONFIG_RGBLED_WIDGET_EXT_POWER_TIMEOUT_MS=1000

CONFIG_RGBLED_WIDGET_LED_SHARING=y

# Keep LED 0 dimly lit as a local power-on and battery-level indicator.
CONFIG_CORNIX_PERSISTENT_BATTERY_INDICATOR=y
